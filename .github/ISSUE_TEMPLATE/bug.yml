name: Bug
description: Something that worked, or should work, is broken.
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Include error text, logs, or screenshots.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture (add contact)
        - Nudge loop (cron / send)
        - Act-link / composer
        - Auth / account
        - Landing / waitlist
        - CI / tooling
        - Other
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ] Regression test reproduces the bug and now passes
        - [ ] 
