name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare (Nuxt types)
        run: npm run postinstall

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npx nuxi typecheck

      - name: Build
        run: npm run build

  component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare (Nuxt types)
        run: npm run postinstall

      - name: Component tests
        run: npm run test:component

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare (Nuxt types)
        run: npm run postinstall

      - name: Start local Supabase stack
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start stack + apply migrations + e2e seed
        # Skip services the app and e2e never touch. Fewer image pulls means
        # fewer `toomanyrequests` rate-limit retries from the registry and a
        # faster job. Needed: db, auth (gotrue), kong, rest, mail catcher.
        run: |
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,postgres-meta,supavisor
          supabase db reset

      - name: Capture Supabase env
        run: |
          supabase status -o env \
            --override-name api.url=NUXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NUXT_PUBLIC_SUPABASE_ANON_KEY \
            >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        env:
          NUXT_PUBLIC_APP_URL: http://localhost:3000
        run: npm run test:e2e
