              - heading "Triage by warmth" [level=3] [ref=e164]
              - paragraph [ref=e165]: Every contact shows how close its follow-up is to slipping — teal when fresh, red when it’s due. See who’s cooling off at a glance.
            - generic [ref=e166]:
              - generic [ref=e167]: ✎
              - heading "Capture in seconds" [level=3] [ref=e168]
              - paragraph [ref=e169]: A name and one way to reach them. Rich details are optional — never a form to fill at a booth.
            - generic [ref=e170]:
