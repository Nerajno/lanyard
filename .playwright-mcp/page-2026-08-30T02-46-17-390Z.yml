          - heading "The hallway track is where it happens. Then it fades." [level=2] [ref=e86]
          - paragraph [ref=e87]: The best part of a conference is the conversations between the talks — the person you met in the coffee line, the one who gave you a real answer in the hallway. You both mean to keep in touch. Then the event ends, the context slips, and the follow-up you meant to send never goes out.
