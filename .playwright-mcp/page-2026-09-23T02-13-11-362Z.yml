              - heading "Climb." [level=3] [ref=f1e148]
              - paragraph [ref=f1e149]: It takes three cups of coffee. Three touchpoints at +2, +14, +45 days by default; switch presets or write your own. Then the contact graduates and Lanyard stops nudging. A finish line, not an endless to-do list.
      - generic [ref=f1e151]:
        - paragraph [ref=f1e152]: What it does
        - heading "Small on purpose." [level=2] [ref=f1e153]
        - paragraph [ref=f1e154]: "Lanyard does one thing a CRM is too heavy to do well: get you to actually follow up."
        - generic [ref=f1e155]:
          - generic [ref=f1e156]:
            - heading "Triage by warmth" [level=3] [ref=f1e157]
            - paragraph [ref=f1e158]: "Every contact shows how close its follow-up is to slipping: green when fresh, amber when it’s due. See who’s cooling off at a glance."
          - generic [ref=f1e159]:
            - heading "Capture in seconds" [level=3] [ref=f1e160]
            - paragraph [ref=f1e161]: A name and one way to reach them. Rich details are optional, never a form to fill at a booth.
          - generic [ref=f1e162]:
            - heading "Nudged your way" [level=3] [ref=f1e163]
            - paragraph [ref=f1e164]: Get reminders by text or email, on your schedule, inside your own send window.
          - generic [ref=f1e165]:
            - heading "One tap to reply" [level=3] [ref=f1e166]
            - paragraph [ref=f1e167]: The nudge opens a drafted message on the right channel. You never write from a blank page, and you always hit send.
          - generic [ref=f1e168]:
            - heading "A defined finish" [level=3] [ref=f1e169]
            - paragraph [ref=f1e170]: Three touchpoints, then a contact graduates and stops nagging you. No infinite queue.
          - generic [ref=f1e171]:
            - heading "Built for the hallway track" [level=3] [ref=f1e172]
            - paragraph [ref=f1e173]: "Made for people who meet many and follow up with few: speakers, organizers, serial attendees."
      - generic [ref=f1e174]:
        - heading "Respecting your focus" [level=2] [ref=f1e177]
        - paragraph [ref=f1e178]: Nudges only go out inside a send window you choose (09:00–21:00 to start), on your local time. Outside it, quiet hours. Follow-ups arrive when you're ready to act on them, not in the middle of deep work or at 2am.
