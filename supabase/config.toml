# Local Supabase dev config — used by `supabase start` and CI e2e.
# This file only affects the local/CI stack, never the hosted project.
# Email confirmation is off so signup e2e reaches the app in one flow.

project_id = "lanyard"

[auth]
# "time" style sessions match a normal dev workflow
session_timeout = 3600

[auth.email]
enable_confirmations = false
enable_signup = true

[api]
enabled = true
schemas = ["public"]
port = 54321

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
