# Netlify auto-detects the Nuxt build, so no [build] block here — overriding it
# would replace the working Nitro netlify preset with a static publish.

# Hourly trigger for the nudge loop (see README → Deploy → Netlify).
[functions."nudge-cron"]
  schedule = "@hourly"

# Daily trigger for hard-deleting accounts past the 14-day grace window.
[functions."purge-cron"]
  schedule = "@daily"